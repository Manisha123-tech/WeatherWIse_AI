services:
  - type: web
    name: weatherwise-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # For persistent SQLite storage on a paid Render plan, attach a disk at /var/data
      # and uncomment DATABASE_PATH below:
      # - key: DATABASE_PATH
      #   value: /var/data/weatherwise.db
